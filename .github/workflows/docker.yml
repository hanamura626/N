name: Build and Run Accounts Service

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versi/Tag image (contoh: 1.0.0, v1.2.3, latest)'
        required: true
        type: string
        default: 'latest'
      argo_domain:
        description: 'Domain tunnel Argo tetap (kosongkan untuk tunnel sementara)'
        required: false
        type: string
        default: ''
      argo_auth:
        description: 'Token atau JSON tunnel Argo (kosongkan untuk tunnel sementara)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate version input
        run: |
          if [ -z "${{ inputs.version }}" ]; then
            echo "::error::Input 'version' tidak boleh kosong."
            exit 1
          fi
          if ! echo "${{ inputs.version }}" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::Versi hanya boleh berisi huruf, angka, titik, garis bawah, dan strip."
            exit 1
          fi
          echo "Versi yang akan di-build: ${{ inputs.version }}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nodejs
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.version == 'latest' }}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Accounts web service
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

  run:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: accounts-service
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/nodejs:${{ inputs.version }}
      ARGO_DOMAIN: ${{ inputs.argo_domain }}
      ARGO_AUTH: ${{ inputs.argo_auth }}

    steps:
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Start accounts service
        run: |
          if [ -n "$ARGO_AUTH" ]; then echo "::add-mask::$ARGO_AUTH"; fi
          echo "Menjalankan image: $IMAGE"
          docker pull "$IMAGE"
          docker rm -f vpn >/dev/null 2>&1 || true
          docker run -d --name vpn -p 3000:3000 \
            -e ARGO_DOMAIN="$ARGO_DOMAIN" \
            -e ARGO_AUTH="$ARGO_AUTH" \
            "$IMAGE"

      - name: Follow service logs
        run: docker logs -f vpn
