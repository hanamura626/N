name: Build and Run Accounts Service

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'server/**'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      argo_domain:
        description: 'Domain tunnel Argo tetap (kosongkan untuk tunnel sementara)'
        required: false
        type: string
        default: ''
      argo_auth:
        description: 'Token atau JSON tunnel Argo (kosongkan untuk tunnel sementara)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/nodejs:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Accounts web service
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

  run:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: accounts-service
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/nodejs:latest
      ARGO_DOMAIN: ${{ inputs.argo_domain }}
      ARGO_AUTH: ${{ inputs.argo_auth }}

    steps:
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Start accounts service
        run: |
          if [ -n "$ARGO_AUTH" ]; then echo "::add-mask::$ARGO_AUTH"; fi
          docker pull "$IMAGE"
          docker rm -f vpn >/dev/null 2>&1 || true
          docker run -d --name vpn -p 3000:3000 \
            -e ARGO_DOMAIN="$ARGO_DOMAIN" \
            -e ARGO_AUTH="$ARGO_AUTH" \
            "$IMAGE"

      - name: Follow service logs
        run: docker logs -f vpn
